stages:
  - build
  - release
before_script:
  - mkdir -p _ccache
  - export CCACHE_BASEDIR=${PWD}
  - export CCACHE_DIR=${PWD}/_ccache
  - apk add --no-cache python3 glib-dev meson ninja xz build-base git

cache:
  paths:
    - _ccache/

build-applet-alpine:
  image: alpine:edge
  stage: build
  script:
   - apk add --no-cache gobject-introspection-dev gtk+3.0-dev vala libwnck3-dev wayland-protocols wayland-dev
   - git clone https://gitlab.com/vala-panel-project/vala-panel.git
   - meson --prefix=/usr vp-build vala-panel && meson install -C vp-build && rm -rf vala-panel && rm -rf vp-build
   - meson --prefix=/usr -Dregistrar=disabled -Djayatana=disabled -Dappmenu-gtk-module=disabled build
   - meson compile -C build
   - meson install -C build --no-rebuild
   - meson dist -C build --no-tests
  artifacts:
    paths:
    - "build/meson-dist/vala-panel-appmenu*.tar.xz"
    expire_in: 1 week

build-gtk-module-main:
  image: alpine:edge
  stage: build
  variables:
    XDG_RUNTIME_DIR: "/tmp/runtime-dir"
    GDK_BACKEND: "wayland"
    NO_AT_BRIDGE: "1"
  script:
   - apk add --no-cache gtk+3.0-dev gtk+2.0-dev libwnck3-dev wayland-protocols wayland-dev gobject-introspection-dev vala weston mutter dbus
   - export VERSION=$(git describe --abbrev=0)
   - mkdir -p -m 700 $XDG_RUNTIME_DIR
   - mkdir -p subprojects/appmenu-gtk-module/subprojects
   - ln -s ../../appmenu-glib-translator subprojects/appmenu-gtk-module/subprojects/appmenu-glib-translator
   - meson --prefix=/usr -Dtests=true build subprojects/appmenu-gtk-module
   - meson compile -C build
   - >-
     dbus-run-session --
     mutter --headless --wayland --no-x11 --virtual-monitor 1024x768 --
     meson test -C build --verbose
   - meson install -C build --no-rebuild
   - meson dist -C build --no-tests
  artifacts:
    paths:
    - "build/meson-dist/appmenu-gtk-module*.tar.xz"
    expire_in: 1 week

build-glib-translator-main:
  image: alpine:edge
  stage: build
  script:
   - apk add --no-cache python3 gobject-introspection-dev vala
   - export VERSION=$(git describe --abbrev=0)
   - meson --prefix=/usr build subprojects/appmenu-glib-translator
   - meson compile -C build
   - meson install -C build --no-rebuild
   - meson dist -C build --no-tests
  artifacts:
    paths:
    - "build/meson-dist/appmenu-glib-translator*.tar.xz"
    expire_in: 1 week

build-registrar-main:
  image: alpine:edge
  stage: build
  script:
   - export VERSION=$(git describe --abbrev=0)
   - meson --prefix=/usr --libexecdir=lib build subprojects/registrar
   - meson compile -C build
   - meson install -C build --no-rebuild
   - meson dist -C build --no-tests
  artifacts:
    paths:
    - "build/meson-dist/registrar*.tar.xz"
    expire_in: 1 week


build-jayatana-main:
  image: alpine:edge
  stage: build
  script:
   - apk add --no-cache libdbusmenu-glib-dev python3 build-base ninja libxkbcommon-dev git libx11-dev meson glib-dev java-common openjdk21-jdk
   - meson --prefix=/usr --libexecdir=lib build subprojects/jayatana
   - meson compile -C build
   - meson install -C build --no-rebuild
   - meson dist -C build --no-tests
  artifacts:
    paths:
    - "build/meson-dist/jayatana*.tar.xz"
    expire_in: 1 week


release-main:
  image: alpine:edge
  stage: release
  script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages gitlab-release
    - gitlab-release --link-in-desc --link-artifact *.tar.xz
  artifacts:
    paths:
      # Must include files passed to gitlab_release
    - "build/meson-dist/appmenu-glib-translator*.tar.xz"
    - "build/meson-dist/appmenu-gtk-module*.tar.xz"
    - "build/meson-dist/registrar*.tar.xz"
    - "build/meson-dist/vala-panel-appmenu*.tar.xz"
    - "build/meson-dist/jayatana*.tar.xz"
  only:
    - tags
