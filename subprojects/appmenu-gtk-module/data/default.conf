# Default configuration for appmenu-gtk-module.
#
# This generic default lives in an "appmenu-gtk-module" subdirectory of the
# config search paths (e.g. /etc/xdg/appmenu-gtk-module/default.conf). To change
# behaviour without touching the system copy, place your own files under
# $XDG_CONFIG_HOME/appmenu-gtk-module/ (usually ~/.config/appmenu-gtk-module/):
# default.conf for generic settings, or "<desktop>.conf" (lowercased name from
# XDG_CURRENT_DESKTOP, e.g. gnome.conf) for per-desktop overrides. Keys are read
# with GKeyFile semantics; string lists use the standard ; separator.

[Core]
# List of applications where appmenu-gtk-module should be disabled.
blacklist=anjuta;freeciv;freeciv-gtk2;freeciv-gtk3;glade;gwyddion;acroread;emacs;emacs23;emacs23-lucid;emacs24;emacs24-lucid

# If this is enabled, menus will follow module presence and possibility of
# export, not shell settings.
shell-override=true

# Backends for appmenu-gtk-module to run (note: on x11 it uses both DBusMenu and
# GMenuModel). Allowed values: x11;gtk-shell-wayland;kwin-wayland
backends-allowed=x11;gtk-shell-wayland;kwin-wayland
